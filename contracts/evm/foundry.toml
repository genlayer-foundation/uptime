# Foundry project for the Uptime pool (Bradbury Phase 2 = Arbitrum Orbit, chain 4221).
# Dependencies are vendored under lib/ (hashes in dependencies.lock.json); no `forge install`.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.37"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "write", path = "./out" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
bradbury = "https://rpc.testnet-chain.genlayer.com"

[fmt]
line_length = 110
bracket_spacing = true

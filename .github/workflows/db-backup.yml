# Nightly encrypted Postgres backup of the Uptime production database (Neon).
#
# - pg_dump custom format (-Fc, same format as the team's gym dumps), client 17 = Neon's server major.
# - Encrypted in the pipe with age: the plaintext dump never touches the runner's disk.
# - Streamed straight into private S3 (s3://genlayer-uptime-db-backups/uptime/YYYY/MM/DD/),
#   SSE-KMS at rest, 30-day lifecycle. Infra + policies: infra/backups/backup-bucket.yml.
#   The job assumes uptime-db-backup-writer via GitHub OIDC (no AWS keys stored); that role
#   can PutObject and nothing else. Restore: README "Backups".
#
# Inputs (names only; values are set by the owner, never committed):
#   secrets.UPTIME_DATABASE_URL          Neon DIRECT connection string (not the -pooler host)
#   vars.UPTIME_BACKUP_AGE_RECIPIENT     age public key (age1...). The private key lives in
#                                        1Password vault "Uptime Production", never in GitHub.
#   vars.UPTIME_BACKUP_ROLE_ARN          writer role ARN (not secret)
# Fails closed: any input missing = red run, nothing uploaded.
name: db-backup

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for the AWS writer role

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_MAJOR: "17"
      BUCKET: genlayer-uptime-db-backups
    steps:
      - name: Check inputs (fail closed)
        env:
          UPTIME_DATABASE_URL: ${{ secrets.UPTIME_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.UPTIME_BACKUP_AGE_RECIPIENT }}
          ROLE_ARN: ${{ vars.UPTIME_BACKUP_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ "${ROLE_ARN}" != arn:aws:iam::*:role/* ]]; then
            echo "::error::variable UPTIME_BACKUP_ROLE_ARN is not set to an IAM role ARN"; exit 1
          fi
          if [ -z "${UPTIME_DATABASE_URL}" ]; then
            echo "::error::secret UPTIME_DATABASE_URL is not set"; exit 1
          fi
          if [[ "${AGE_RECIPIENT}" != age1* ]]; then
            echo "::error::variable UPTIME_BACKUP_AGE_RECIPIENT is not set to an age public key (age1...)"; exit 1
          fi
          # pg_dump needs Neon's direct endpoint; the pooler (PgBouncer) host breaks it.
          if [[ "${UPTIME_DATABASE_URL}" == *-pooler.* ]]; then
            echo "::error::UPTIME_DATABASE_URL points at the Neon pooler; use the DIRECT connection string"; exit 1
          fi

      - name: Install postgresql-client-17 and age
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}" age
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version
          age --version

      - name: Assume the backup writer role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.UPTIME_BACKUP_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: uptime-db-backup-${{ github.run_id }}

      - name: Dump, encrypt and upload (streamed; no plaintext on disk)
        env:
          UPTIME_DATABASE_URL: ${{ secrets.UPTIME_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.UPTIME_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          key="uptime/$(date -u +%Y/%m/%d)/uptime-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          # The role cannot read back (no Get/Head/List), so the size check counts the
          # encrypted bytes going through the pipe (a FIFO, not a file) instead.
          mkfifo "${RUNNER_TEMP}/count"
          wc -c < "${RUNNER_TEMP}/count" > "${RUNNER_TEMP}/size" &
          counter=$!
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" \
              --format=custom --compress=6 --no-owner --no-privileges \
              --dbname="${UPTIME_DATABASE_URL}" \
            | age --encrypt --recipient "${AGE_RECIPIENT}" \
            | tee "${RUNNER_TEMP}/count" \
            | aws s3 cp - "s3://${BUCKET}/${key}" --only-show-errors
          wait "${counter}"
          size=$(tr -d ' ' < "${RUNNER_TEMP}/size")
          if [ "${size}" -lt 1024 ]; then
            echo "::error::encrypted dump is only ${size} bytes (uploaded as ${key}; inspect it)"; exit 1
          fi
          echo "s3://${BUCKET}/${key}: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"
